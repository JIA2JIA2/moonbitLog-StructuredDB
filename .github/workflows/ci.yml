name: CI

on:
  push:
    branches: [main]
  pull_request:

# Toolchain policy: the installer only serves `latest` (versioned paths like
# binaries/<version>/ return 403), so a version pin is not possible. Format
# rules can drift with upstream releases (the `derive` -> `#derive` breakage):
# when `Check formatting` or the mbti gate turns red without code changes,
# upgrade the local toolchain, run `moon fmt`, and commit the result.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain version
        run: moon version --all

      - name: Check formatting
        run: moon fmt --check

      - name: Check public API snapshots (mbti)
        run: |
          moon info
          git diff --exit-code '**/*.mbti'

      - name: Type-check (wasm)
        run: moon check --target wasm

      - name: Type-check (native)
        run: moon check --target native

      - name: Build native (CLI and examples)
        run: moon build --target native

      - name: Build wasm (browser demo)
        run: moon build --target wasm

      - name: Test (wasm)
        run: moon test

      - name: Test (native, with coverage)
        run: moon test --enable-coverage --target native

      - name: Coverage summary
        run: |
          moon coverage report -f summary | tee coverage_summary.txt
          {
            echo '## Coverage (native)'
            echo '```'
            cat coverage_summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Benchmark (native)
        run: moon bench --target native | tee bench_results.txt

      # Gate on the ms-level benchmarks only: µs-level ones are too noisy on
      # shared runners. Thresholds carry 5-6x headroom over the pinned
      # toolchain's local numbers (sequential scan 0.9ms, range scan 10ms,
      # recover 5ms) — they exist to catch order-of-magnitude regressions,
      # not to measure absolute speed. Tighten deliberately.
      - name: Performance gate (native)
        run: |
          python3 - <<'EOF'
          import re, sys
          limits = {
              "bench native sequential scan": 5.0,
              "bench range scan": 50.0,
              "bench segment recover": 30.0,
              "bench append batch bulk write": 20.0,
          }
          text = open("bench_results.txt", encoding="utf-8").read()
          failed = []
          cur = None
          for line in text.splitlines():
              m = re.search(r'\("([^"]+)"\)', line)
              if m:
                  cur = m.group(1)
                  continue
              t = re.match(r'\s*([\d.]+)\s*(µs|ms)\s*±', line)
              if t and cur:
                  ms = float(t.group(1)) * (1.0 if t.group(2) == "ms" else 0.001)
                  limit = limits.get(cur)
                  if limit is not None and ms > limit:
                      failed.append(f"{cur}: {ms:.2f}ms > {limit}ms limit")
                  cur = None
          if failed:
              print("PERFORMANCE REGRESSION:")
              for f in failed:
                  print("  " + f)
              sys.exit(1)
          print("performance gate passed")
          EOF

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench_results.txt

      - name: CLI smoke test
        run: |
          set -euo pipefail
          EXE=_build/native/debug/build/src/cli/cli.exe
          D=$(mktemp -d)
          "$EXE" put "$D" user:1 alice
          "$EXE" put-batch "$D" user:2 bob user:3 carol
          "$EXE" getkey "$D" user:1
          "$EXE" cursor-save "$D" consumer-a 2
          "$EXE" cursor-drop "$D" consumer-a
          "$EXE" fsck "$D"
          "$EXE" export "$D" /tmp/moonlog-export.tmp
          "$EXE" import "$(mktemp -d)" /tmp/moonlog-export.tmp
          "$EXE" compact "$D"
          "$EXE" fsck "$D"
          "$EXE" recover "$D"
