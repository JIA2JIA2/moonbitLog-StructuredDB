name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain version
        run: moon version --all

      - name: Check formatting
        run: moon fmt --check

      - name: Type-check (wasm)
        run: moon check --target wasm

      - name: Type-check (native)
        run: moon check --target native

      - name: Build native (CLI and examples)
        run: moon build --target native

      - name: Build wasm (browser demo)
        run: moon build --target wasm

      - name: Test (wasm)
        run: moon test

      - name: Test (native)
        run: moon test --target native

      - name: Benchmark (native)
        run: moon bench --target native

      - name: CLI smoke test
        run: |
          set -euo pipefail
          EXE=_build/native/debug/build/src/cli/cli.exe
          D=$(mktemp -d)
          "$EXE" put "$D" user:1 alice
          "$EXE" put-batch "$D" user:2 bob user:3 carol
          "$EXE" getkey "$D" user:1
          "$EXE" cursor-save "$D" consumer-a 2
          "$EXE" cursor-load "$D" consumer-a
          "$EXE" fsck "$D"
          "$EXE" compact "$D"
          "$EXE" fsck "$D"
          "$EXE" recover "$D"
