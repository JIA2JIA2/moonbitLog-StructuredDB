name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

# Keep in sync with ci.yml: the installer only serves `latest`, so releases
# are built with whatever toolchain is current at publish time.
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain version
        run: moon version --all

      - name: Verify the package builds
        run: |
          moon check --target native
          moon test
          moon test --target native
          moon package

      - name: Publish to mooncakes.io
        if: github.event_name == 'release'
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        run: |
          printf '%s\n' "$MOONCAKES_TOKEN" > ~/.moon/credentials.json
          moon publish
